[custom]

;===============================================================================
; 规则集定义
; 原则：个人/细分规则在前，宽泛分类在后；Mihomo 按首次匹配执行。
; OpenClash 顶部 SRC-IP-CIDR 覆写由插件另行插入，不在本文件中重复定义。
;===============================================================================

;个人高优先级规则
ruleset=🚀 默认节点,https://raw.githubusercontent.com/silver9127/ruanluyou/refs/heads/main/defaultnode.list
ruleset=🕹 常用站点,https://raw.githubusercontent.com/silver9127/ruanluyou/refs/heads/main/oftenwebsite
ruleset=🇺🇲 美国站点,https://raw.githubusercontent.com/silver9127/ruanluyou/refs/heads/main/gous.list
ruleset=🤖 Ai,https://raw.githubusercontent.com/silver9127/ruanluyou/refs/heads/main/AI.list

;国内厂商和中国区服务：必须位于对应全球分类之前
ruleset=🇨🇳 国内常用,[]GEOSITE,apple-cn
ruleset=🇨🇳 国内常用,[]GEOSITE,baidu
ruleset=🇨🇳 国内常用,[]GEOSITE,tencent
;Alibaba 使用 domain-only YAML，避免把海外阿里 IP 段和无效进程规则一并导入
ruleset=🇨🇳 国内常用,clash-domain:https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Alibaba/Alibaba_Domain.yaml

;国外服务细分：放在宽泛娱乐和 geolocation-!cn 之前
ruleset=🍎 Apple,[]GEOSITE,apple
ruleset=🍀 Google,[]GEOSITE,google
ruleset=🪟 Microsoft,[]GEOSITE,microsoft
ruleset=♻️ Speedtest,[]GEOSITE,speedtest
ruleset=🚀 默认节点,[]GEOSITE,youtube
ruleset=🎵 TikTok,[]GEOSITE,tiktok

;国内外影音娱乐及新闻媒体
;category-entertainment 包含影音、音乐、直播、游戏等；细分的 YouTube/TikTok 已在前面优先匹配
ruleset=🎞️ 国内媒体,[]GEOSITE,category-entertainment-cn
ruleset=🎞️ 国内媒体,[]GEOSITE,category-media-cn
ruleset=🌍 国外媒体,[]GEOSITE,category-entertainment
ruleset=🌍 国外媒体,[]GEOSITE,category-media
ruleset=🌍 国外媒体,[]GEOSITE,category-porn

;明确的自定义补充规则
ruleset=🇨🇳 国内常用,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list
ruleset=🇨🇳 国内常用,https://raw.githubusercontent.com/silver9127/ruanluyou/refs/heads/main/Direct.list

;最终国内外兜底：不再叠加 ProxyGFW、ChinaDomain、ChinaCompanyIp 和 China.list
ruleset=🎯 国内直连,[]GEOSITE,cn
ruleset=🚀 默认节点,[]GEOSITE,geolocation-!cn
ruleset=🎯 国内直连,[]GEOIP,CN,no-resolve
ruleset=🐟 漏网之鱼,[]FINAL


;===============================================================================
; 策略组定义
;===============================================================================

custom_proxy_group=🚀 默认节点`select`[]🔯 香港自动`[]🔯 日本自动`[]🔯 加坡自动`[]🔯 美国自动`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇸🇬 加坡节点`[]🇺🇲 美国节点`[]💎 搬瓦工`[]🐸 手动切换`[]DIRECT
custom_proxy_group=🛵 局部控制`select`[]💎 搬瓦工`[]🐸 手动切换`[]DIRECT
custom_proxy_group=🇭🇰 香港节点`select`(香港|HK|Hong Kong|🇭🇰|HongKong)
custom_proxy_group=🇸🇬 加坡节点`select`(新加坡|坡|狮城|SG|🇸🇬|Singapore)
custom_proxy_group=🇺🇲 美国节点`select`(?=.*(vless-reality|tuic-443|美|波特兰|达拉斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|🇺🇲|US|United States))^((?!(vless-reality 2|tuic-443 2|vless-reality 3|tuic-443 3)).)*$
custom_proxy_group=🇯🇵 日本节点`select`(日本|川日|东京|大阪|🇯🇵|泉日|埼玉|沪日|深日|JP|Japan)
custom_proxy_group=💎 搬瓦工`select`[]📱 VPS-IP1`(?=.*(vless-reality|tuic-443))^((?!(vless-reality 2|tuic-443 2|vless-reality 3|tuic-443 3)).)*$
custom_proxy_group=📱 VPS-IP1`select`(vless-reality 2|tuic-443 2)
;custom_proxy_group=📱 VPS-IP2`select`(vless-reality 3|tuic-443 3)

;-------------------------------------------------------------------------------
custom_proxy_group=🕹 常用站点`select`[]🚀 默认节点`[]🔯 加坡自动`[]🔯 日本自动`[]🔯 香港自动`[]🔯 美国自动`[]🐸 手动切换`[]DIRECT
custom_proxy_group=🇺🇲 美国站点`select`[]🇺🇲 美国节点`[]🔯 美国自动`[]💎 搬瓦工
custom_proxy_group=🤖 Ai`select`[]🚀 默认节点`[]💎 搬瓦工`[]🐸 手动切换`[]DIRECT
custom_proxy_group=🍀 Google`select`[]🚀 默认节点`[]🔯 加坡自动`[]🔯 日本自动`[]🔯 香港自动`[]🔯 美国自动`[]🐸 手动切换`[]DIRECT
custom_proxy_group=🎵 TikTok`select`[]🚀 默认节点`[]🔯 加坡自动`[]🔯 日本自动`[]🔯 美国自动`[]🐸 手动切换`[]DIRECT
custom_proxy_group=🌍 国外媒体`select`[]🚀 默认节点`[]🔯 加坡自动`[]🔯 日本自动`[]🔯 香港自动`[]🔯 美国自动`[]🐸 手动切换`[]DIRECT
custom_proxy_group=🍎 Apple`select`[]🚀 默认节点`[]🇸🇬 加坡节点`[]🇯🇵 日本节点`[]🇭🇰 香港节点`[]🇺🇲 美国节点`[]🐸 手动切换`[]DIRECT
custom_proxy_group=🪟 Microsoft`select`[]🚀 默认节点`[]🇸🇬 加坡节点`[]🇯🇵 日本节点`[]🇭🇰 香港节点`[]🇺🇲 美国节点`[]🐸 手动切换`[]DIRECT
custom_proxy_group=♻️ Speedtest`select`[]🚀 默认节点`[]🇸🇬 加坡节点`[]🇯🇵 日本节点`[]🇭🇰 香港节点`[]🇺🇲 美国节点`[]🐸 手动切换`[]DIRECT
custom_proxy_group=🎞️ 国内媒体`select`[]🚀 默认节点`[]🐸 手动切换`[]DIRECT
custom_proxy_group=🇨🇳 国内常用`select`[]🚀 默认节点`[]🐸 手动切换`[]DIRECT
;国内大范围兜底默认 DIRECT，仍保留临时代理和手动切换能力
custom_proxy_group=🎯 国内直连`select`[]🚀 默认节点`[]🐸 手动切换`[]DIRECT

;-------------------------------------------------------------------------------
custom_proxy_group=🔯 香港自动`url-test`(香港|HK|Hong Kong|🇭🇰|HongKong)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🔯 加坡自动`url-test`(新加坡|坡|狮城|SG|🇸🇬|Singapore)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🔯 美国自动`url-test`(?=.*(vless-reality|tuic-443|美|波特兰|达拉斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|🇺🇲|US|United States))^((?!(vless-reality 2|tuic-443 2|vless-reality 3|tuic-443 3)).)*$`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🔯 日本自动`url-test`(日本|川日|东京|大阪|🇯🇵|泉日|埼玉|沪日|深日|JP|Japan)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🐸 手动切换`select`(^(?!.*(vless-reality 2|tuic-443 2|vless-reality 3|tuic-443 3)).*)
custom_proxy_group=🐟 漏网之鱼`select`[]🚀 默认节点`[]🐸 手动切换`[]DIRECT


;===============================================================================
; 启用自定义规则集
;===============================================================================

enable_rule_generator=true
overwrite_original_rules=true
